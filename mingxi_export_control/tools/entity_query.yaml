name: "entity_query"
label:
  en_US: "Query Restricted Entities"
  zh_Hans: "查询受限实体名单"
description:
  en_US: "Query China's restricted entity lists (管控名单/不可靠实体清单/关注清单/反制清单). Search by company name (Chinese or English), aliases, or country. Returns entity status, control measures, and official announcement source."
  zh_Hans: "查询中国受限实体名单（管控名单/不可靠实体清单/关注清单/反制清单）。可按公司名称（中英文）、别名或国家搜索，返回实体状态、管控措施及官方公告来源。"
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Entity Name"
      zh_Hans: "实体名称"
    help:
      en_US: "Company or organization name in Chinese or English (e.g. Anduril, 安杜里尔, Lockheed Martin)."
      zh_Hans: "公司或机构名称，中英文均可（如 Anduril、安杜里尔、洛克希德·马丁）。"
    placeholder: "e.g. Anduril, 安杜里尔"
  - name: format
    type: string
    required: false
    default: "json"
    label:
      en_US: "Output Format"
      zh_Hans: "输出格式"
    help:
      en_US: "json returns structured data; text returns human-readable summary."
      zh_Hans: "json 返回结构化数据；text 返回可读性摘要。"
    options:
      - value: "json"
        label: "JSON"
      - value: "text"
        label: "Text"
extra:
  python: "tools/entity_query.py"
